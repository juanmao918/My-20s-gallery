<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>20岁的私密屋子</title>
    <style>
        body { font-family: sans-serif; background: #f4f4f4; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        #login-box { background: white; padding: 2rem; border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); text-align: center; }
        #content { display: none; padding: 20px; width: 100%; max-width: 1200px; height: auto; }
        .category { margin-bottom: 40px; }
        .gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 15px; }
        .gallery img { width: 100%; border-radius: 5px; transition: transform 0.3s; }
        .gallery img:hover { transform: scale(1.05); }
        h2 { border-left: 5px solid #333; padding-left: 10px; color: #333; }
    </style>
</head>
<body>

    <div id="login-box">
        <h3>🔑 欢迎来到我的20岁屋子</h3>
        <p>请输入暗号进入</p>
        <input type="password" id="password" placeholder="输入密码...">
        <button onclick="checkPassword()">开门</button>
    </div>

    <div id="content">
        <h1>🎞️ 20岁的喜好博物馆</h1>
        
        <div class="category">
            <h2>🎬 那些心动的电影</h2>
            <div class="gallery">
                <img src="movies/p1.jpg"> <img src="movies/p2.jpg">
            </div>
        </div>

        <div class="category">
            <h2>👗 DIY</h2>
            <div class="gallery">
                <img src="DIY/p1.jpg">
            </div>
        </div>

        <div class="category">
            <h3>🏠 我对居住的想象</h3>
            <div class="gallery">
                <img src="little house/p（1）.jpg">
            </div>
        </div>
    </div>

    <script>
        function checkPassword() {
            var pass = document.getElementById("password").value;
            // XXNlu0322
            if (pass === 'XXNlu0322') { 
                document.getElementById("login-box").style.display = "none";
                document.getElementById("content").style.display = "block";
                document.body.style.height = "auto";
            } else {
                alert("暗号不对哦，再想想？");
            }
        }
    </script>
</body>
</html>
