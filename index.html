<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>20岁的喜好博物馆</title>
    <style>
        /* 1. 基础样式 */
        body, html { margin: 0; padding: 0; font-family: -apple-system, sans-serif; background: #fff; height: 100%; }
        .hidden { display: none !important; }

        /* 2. 密码页样式：全屏居中 */
        #login-page {
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            height: 100vh; width: 100vw; background: #fff; position: fixed; top: 0; left: 0; z-index: 999;
        }
        #login-page input { padding: 12px; border: 1px solid #ddd; width: 200px; text-align: center; border-radius: 4px; outline: none; margin-bottom: 15px; }
        #login-page button { padding: 10px 40px; background: #333; color: #fff; border: none; border-radius: 4px; cursor: pointer; transition: 0.3s; }
        #login-page button:hover { background: #000; }

        /* 3. 博物馆内容页样式 */
        #museum-content { min-height: 100vh; display: flex; flex-direction: column; }
        nav { 
            position: sticky; top: 0; background: rgba(255,255,255,0.95); 
            backdrop-filter: blur(10px); padding: 25px; text-align: center; 
            border-bottom: 1px solid #f0f0f0; z-index: 100; 
        }
        nav a { margin: 0 20px; cursor: pointer; color: #999; text-decoration: none; font-size: 14px; letter-spacing: 2px; transition: 0.3s; font-weight: 300; }
        nav a:hover, nav a.active { color: #000; font-weight: 500; }

        /* 4. 照片墙样式 */
        .gallery { 
            display: grid; 
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); 
            gap: 15px; padding: 15px; 
        }
        .gallery img { 
            width: 100%; aspect-ratio: 1/1; object-fit: cover; 
            border-radius: 2px; background: #f7f7f7; 
            cursor: zoom-in; transition: transform 0.4s ease;
        }
        .gallery img:hover { transform: scale(1.02); }

        /* 响应式调整 */
        @media (max-width: 600px) {
            .gallery { grid-template-columns: repeat(2, 1fr); gap: 8px; padding: 8px; }
            nav a { margin: 0 10px; font-size: 12px; }
        }
    </style>
</head>
<body>

    <div id="login-page">
        <h2 style="font-weight: 200; letter-spacing: 4px; margin-bottom: 30px;">THE MUSEUM</h2>
        <input type="password" id="pw-input" placeholder="输入进入暗号">
        <button onclick="checkAccess()">开门</button>
    </div>

    <div id="museum-content" class="hidden">
        <nav>
            <a onclick="refresh('all')" id="btn-all">RANDOM</a>
            <a onclick="refresh('little_house')" id="btn-house">LITTLE HOUSE</a>
            <a onclick="refresh('DIY')" id="btn-diy">DIY</a>
            <a onclick="refresh('hair_style')" id="btn-hair">HAIR STYLE</a>
        </nav>
        <div id="gallery-wall" class="gallery"></div>
    </div>

    <script>
        // 【1. 这里改成你的密码】
        const MY_PASS = "XXNlu0322"; 

        // 【2. 配置文件夹信息】
        const FOLDERS = [
            { id: 'little_house', count: 100 }, 
            { id: 'DIY', count: 100 },
            { id: 'hair_style', count: 100 }
        ];

        // 【3. 暴力尝试所有格式和命名（带空格和不带空格）】
        const FORMATS = ['.jpg', '.png', '.jpeg', '.webp', '.JPG', '.PNG', '.WEBP'];
        const NAMES = ["p (${i})", "p(${i})"]; 

        function checkAccess() {
            if(document.getElementById('pw-input').value === MY_PASS) {
                document.getElementById('login-page').remove(); 
                document.getElementById('museum-content').classList.remove('hidden');
                refresh('all');
            } else { alert('暗号不对哦'); }
        }

        function refresh(mode) {
            const wall = document.getElementById('gallery-wall');
            wall.innerHTML = '加载中...';
            document.querySelectorAll('nav a').forEach(a => a.classList.remove('active'));
            
            let list = [];
            FOLDERS.forEach(cat => {
                if (mode === 'all' || mode === cat.id) {
                    for (let i = 1; i <= cat.count; i++) {
                        list.push({ folder: cat.id, index: i });
                    }
                }
            });

            if (mode === 'all') list.sort(() => Math.random() - 0.5);

            wall.innerHTML = '';
            list.forEach(item => {
                const img = document.createElement('img');
                wall.appendChild(img);
                tryAll(img, item.folder, item.index, 0, 0);
                img.onclick = () => window.open(img.src);
            });
        }

        function tryAll(img, folder, i, nIdx, eIdx) {
            if (nIdx >= NAMES.length) return; 
            let name = NAMES[nIdx].replace('${i}', i);
            let path = folder + '/' + name + FORMATS[eIdx];
            let t = new Image();
            t.src = path;
            t.onload = () => img.src = path;
            t.onerror = () => {
                if (eIdx < FORMATS.length - 1) {
                    tryAll(img, folder, i, nIdx, eIdx + 1);
                } else {
                    tryAll(img, folder, i, nIdx + 1, 0);
                }
            };
        }
    </script>
</body>
</html>
