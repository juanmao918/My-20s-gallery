<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>20岁的喜好博物馆</title>
    <style>
        body { font-family: "PingFang SC", sans-serif; background: #fdfdfd; margin: 0; padding: 0; color: #333; }
        #login-box { display: flex; flex-direction: column; justify-content: center; align-items: center; height: 100vh; }
        nav { background: rgba(255,255,255,0.9); backdrop-filter: blur(10px); padding: 20px; text-align: center; position: sticky; top: 0; box-shadow: 0 1px 5px rgba(0,0,0,0.05); z-index: 100; }
        nav a { margin: 0 20px; text-decoration: none; color: #888; font-size: 15px; letter-spacing: 1px; cursor: pointer; transition: 0.3s; }
        nav a:hover, nav a.active { color: #000; border-bottom: 1px solid #000; }
        .gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 10px; padding: 10px; }
        .gallery img { width: 100%; aspect-ratio: 1/1; object-fit: cover; border-radius: 4px; cursor: zoom-in; transition: opacity 0.3s; background: #eee; }
        .gallery img:hover { opacity: 0.8; }
        .hidden { display: none; }
    </style>
</head>
<body>

    <div id="login-box">
        <h3 style="font-weight: 300;">🔑 输入暗号进入屋子</h3>
        <input type="password" id="password" style="padding:10px; border:1px solid #ddd; outline:none;">
        <button onclick="checkPassword()" style="margin-top:20px; padding:8px 30px; background:#333; color:white; border:none; cursor:pointer;">开门</button>
    </div>

    <div id="main-content" class="hidden">
        <nav id="nav-bar">
            <a onclick="loadCategory('random')">RANDOM</a>
            <a onclick="loadCategory('little_house')">LITTLE HOUSE</a>
            <a onclick="loadCategory('DIY')">DIY</a>
        </nav>
        <div id="gallery-container" class="gallery"></div>
    </div>

    <script>
        // 1. 在这里配置你的文件夹和对应的图片数量
        const config = [
            { name: 'little_house', count: 17 },
            { name: 'DIY', count: 15 }
        ];

        // 2. 支持的格式列表
        const extensions = ['.jpg', '.png', '.jpeg', '.JPG', '.PNG'];

        function checkPassword() {
            if (document.getElementById("password").value === 'XXNlu0322') {
                document.getElementById("login-box").classList.add('hidden');
                document.getElementById("main-content").classList.remove('hidden');
                loadCategory('random');
            } else { alert("暗号不对哦"); }
        }

        async function loadCategory(target) {
            const container = document.getElementById('gallery-container');
            container.innerHTML = '';
            
            let allImages = [];

            // 筛选需要展示的图片路径
            config.forEach(cat => {
                if (target === 'random' || target === cat.name) {
                    for (let i = 1; i <= cat.count; i++) {
                        allImages.push({ folder: cat.name, index: i });
                    }
                }
            });

            if (target === 'random') {
                allImages.sort(() => Math.random() - 0.5);
            }

            // 渲染图片
            allImages.forEach(item => {
                const imgEntity = document.createElement('img');
                const basePath = `${item.folder}/p (${item.index})`;
                
                // 核心逻辑：尝试不同后缀
                tryLoad(imgEntity, basePath, 0);
                
                imgEntity.onclick = () => window.open(imgEntity.src, '_blank');
                container.appendChild(imgEntity);
            });
        }

        // 递归尝试加载不同后缀
        function tryLoad(imgElement, pathWithoutExt, extIndex) {
            if (extIndex >= extensions.length) return; // 试遍了都没找到
            
            const currentSrc = pathWithoutExt + extensions[extIndex];
            const tester = new Image();
            tester.src = currentSrc;
            
            tester.onload = () => {
                imgElement.src = currentSrc; // 加载成功，赋值
            };
            tester.onerror = () => {
                tryLoad(imgElement, pathWithoutExt, extIndex + 1); // 失败，尝试下一个后缀
            };
        }
    </script>
</body>
</html>
