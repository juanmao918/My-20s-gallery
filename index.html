<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>20岁的喜好博物馆</title>
    <style>
        :root { --gap: 10px; }
        body { font-family: -apple-system, sans-serif; background: #fff; margin: 0; }
        nav { position: sticky; top: 0; background: white; padding: 20px; text-align: center; border-bottom: 1px solid #eee; z-index: 10; }
        nav a { margin: 0 15px; cursor: pointer; color: #888; text-decoration: none; font-size: 14px; transition: 0.3s; }
        nav a:hover { color: #000; }
        .gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: var(--gap); padding: var(--gap); }
        .gallery img { width: 100%; aspect-ratio: 1/1; object-fit: cover; border-radius: 4px; background: #f9f9f9; cursor: zoom-in; }
        #login-box { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; }
        .hidden { display: none; }
    </style>
</head>
<body>

    <div id="login-box">
        <h3>🔑 输入暗号</h3>
        <input type="password" id="pw" style="padding:8px; border:1px solid #ddd;">
        <button onclick="entry()" style="margin-top:10px; padding:8px 20px;">开门</button>
    </div>

    <div id="main" class="hidden">
        <nav>
            <a onclick="render('all')">首页随机</a>
            <a onclick="render('little_house')">居住想象</a>
            <a onclick="render('DIY')">DIY作品</a>
        </nav>
        <div id="wall" class="gallery"></div>
    </div>

    <script>
        // 【只需修改这里】
        const password = "XXNlu0322"; 
        const repo = [
            { name: 'little_house', count: 100 }, // 确保文件夹名已改成 little_house
            { name: 'DIY', count: 100 }          // 根据你截图显示，DIY好像有很多
        ];
        const exts = ['.jpg', '.png', '.jpeg', '.JPG', '.PNG'];

        function entry() {
            if(document.getElementById('pw').value === password) {
                document.getElementById('login-box').classList.add('hidden');
                document.getElementById('main').classList.remove('hidden');
                render('all');
            } else { alert('暗号错误'); }
        }

        async function render(mode) {
            const wall = document.getElementById('wall');
            wall.innerHTML = '加载中...';
            let list = [];

            repo.forEach(cat => {
                if (mode === 'all' || mode === cat.name) {
                    for (let i = 1; i <= cat.count; i++) {
                        list.push({ path: `${cat.name}/p (${i})` });
                    }
                }
            });

            if (mode === 'all') list.sort(() => Math.random() - 0.5);

            wall.innerHTML = '';
            list.forEach(item => {
                const img = document.createElement('img');
                wall.appendChild(img);
                // 自动尝试后缀
                tryNext(img, item.path, 0);
                img.onclick = () => window.open(img.src);
            });
        }

        function tryNext(el, base, index) {
            if (index >= exts.length) return;
            let test = new Image();
            test.src = base + exts[index];
            test.onload = () => el.src = test.src;
            test.onerror = () => tryNext(el, base, index + 1);
        }
    </script>
</body>
</html>
